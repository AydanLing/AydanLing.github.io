<meta name="description" content="Aydan Ling's robotics portfolio: a 3D garage where every project is something on the bench.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen 3D garage. A thin HUD sits on top: name and links up top, project chips along the bottom, one windowed panel for whatever is open. Deliberately single-theme (a garage at night). */
:root {
  --bg: #000000;
  --panel: #0c0f14;
  --panel-2: #10141b;
  --fg: #efece3;
  --muted: #9a9890;
  --line: #222a37;
  --accent: #8fabd4;
  --deep: #4a70a9;
  --font-display: "Instrument Serif", Georgia, serif;
  --font-body: "Hanken Grotesk", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#app { position: relative; height: 100%; width: 100%; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; }
a { color: inherit; text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* HUD */
.hud-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; z-index: 3; }
.hud-top > * { pointer-events: auto; }
.name h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: 1; margin: 0; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
.name p { margin: 6px 0 0; color: var(--muted); font-size: 0.9375rem; text-shadow: 0 1px 10px rgba(0,0,0,.8); }
.name .now { display: flex; gap: 8px; align-items: baseline; margin-top: 8px; font-size: 0.875rem; color: var(--fg); max-width: 46ch; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; box-shadow: 0 0 10px var(--accent); }
.menu { display: flex; gap: 4px; padding: 4px; background: rgba(12, 15, 20, 0.82); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px); flex-wrap: wrap; }
.menu button, .menu a { background: none; border: 0; padding: 6px 10px; border-radius: 7px; color: var(--muted); cursor: pointer; text-decoration: none; font-size: 0.9375rem; }
.menu button:hover, .menu a:hover { color: var(--fg); background: var(--panel-2); }

.hud-bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; pointer-events: none;
  padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; pointer-events: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; background: rgba(12, 15, 20, 0.85); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 0.875rem; cursor: pointer; white-space: nowrap; }
.chips button:hover, .chips button.on { border-color: var(--accent); color: var(--accent); }
.hint { margin: 6px 0 0; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); pointer-events: none; }

/* Floating labels over the scene */
.labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.tag { position: absolute; transform: translate(-50%, -100%); font-family: var(--font-mono); font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; background: rgba(12, 15, 20, 0.88); border: 1px solid var(--line); color: var(--fg); white-space: nowrap; transition: border-color .15s ease, color .15s ease, opacity .2s ease; }
.tag.hot { border-color: var(--accent); color: var(--accent); }
.tag.me { border-color: var(--accent); }
.tag.me::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 6px; vertical-align: 1px; }

/* Window */
.win { position: absolute; z-index: 4; right: max(16px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); width: min(420px, calc(100% - 32px)); max-height: min(72vh, 640px);
  display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.6); animation: winIn .2s ease-out; }
.win-bar { display: flex; align-items: center; gap: 6px; padding: 9px 10px; background: var(--panel-2); border-bottom: 1px solid var(--line); flex: none; }
.win-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: inline-block; }
.win-bar i:first-child { background: var(--accent); }
.win-bar .path { margin-left: 6px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win-bar .close { background: none; border: 1px solid var(--line); border-radius: 6px; width: 26px; height: 26px; cursor: pointer; color: var(--muted); line-height: 1; }
.win-bar .close:hover { color: var(--fg); border-color: var(--accent); }
.win-body { padding: 16px 18px 18px; overflow-y: auto; min-height: 0; }
.gallery { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -2px 14px; padding: 2px 2px 6px; }
.gallery button { flex: 0 0 auto; padding: 0; border: 1px solid var(--line, rgba(239,236,227,.12)); border-radius: 10px; background: #0c0f14; overflow: hidden; cursor: zoom-in; scroll-snap-align: start; }
.gallery img, .gallery video { display: block; height: 210px; width: auto; max-width: 78vw; object-fit: contain; }
.gallery button:only-child { flex: 1 1 auto; }
.gallery button:only-child img, .gallery button:only-child video { width: 100%; max-width: none; }
.gallery button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 700px) { .gallery img, .gallery video { height: 170px; } }
.lightbox { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.86); cursor: zoom-out; }
.lightbox img, .lightbox video { max-width: 100%; max-height: 100%; border-radius: 10px; }
.win-body h2 { font-family: var(--font-display); font-weight: 400; font-size: 2rem; line-height: 1.05; margin: 0 0 4px; }
.win-body .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 0.8125rem; color: var(--muted); margin-bottom: 10px; }
.win-body .award { color: var(--accent); }
.win-body p { margin: 0 0 10px; line-height: 1.55; font-size: 0.9375rem; }
.win-body .lead { font-size: 1rem; color: var(--fg); }
.win-body ul { margin: 0 0 10px; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.win-body li { font-size: 0.9375rem; line-height: 1.5; color: var(--muted); }
.win-body li::marker { color: var(--accent); }
.win-body h4 { margin: 12px 0 6px; font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 6px 0 12px; }
.spec { background: var(--panel-2); padding: 8px 10px; display: flex; flex-direction: column; }
.spec b { font-family: var(--font-mono); font-weight: 500; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.spec span { font-size: 0.75rem; color: var(--muted); line-height: 1.3; }
.exp { display: flex; flex-direction: column; gap: 10px; }
.exp div { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--panel-2); }
.exp b { display: block; }
.exp span { font-size: 0.8125rem; color: var(--muted); }
.email { display: inline-block; font-family: var(--font-mono); padding: 7px 10px; border: 1px dashed var(--line); border-radius: 7px; user-select: all; margin-right: 6px; }
.copy { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; cursor: pointer; }
.copy:hover { border-color: var(--accent); }
@keyframes winIn { from { opacity: 0; transform: translateY(calc(-50% + 8px)) scale(.98); } to { opacity: 1; transform: translateY(-50%); } }

.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--font-mono); font-size: 0.8125rem; z-index: 1; }
.nogl { position: absolute; inset: 0; overflow-y: auto; padding: 120px max(16px, env(safe-area-inset-left, 0px)) 120px; }

@media (max-width: 700px) {
  .win { top: auto; bottom: max(78px, calc(env(safe-area-inset-bottom, 0px) + 70px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); transform: none; width: auto; max-height: 55vh; animation: none; }
  .name .now { display: none; }
  .tag { font-size: 0.6875rem; padding: 2px 6px; }
}
@media (prefers-reduced-motion: reduce) { .win { animation: none; } }
</style>
</head>
<body style="margin:0">

  <div id="stage" aria-label="A 3D garage at night. Each project is an object you can click."></div>

<script>

    box(cart, 0.5, 0.05, 0.4, C.dark, 0, 0.8, 0); box(cart, 0.5, 0.05, 0.4, C.dark, 0, 0.3, 0);
    [[-0.22, -0.17], [0.22, -0.17], [-0.22, 0.17], [0.22, 0.17]].forEach(function (l) { box(cart, 0.04, 0.8, 0.04, C.steel, l[0], 0.4, l[1], { m: 0.5, r: 0.4 }); });
    box(cart, 0.46, 0.3, 0.03, C.dark, 0, 1.0, -0.1, { m: 0.4, r: 0.4 }).rotation.x = -0.2;
    var scr = box(cart, 0.42, 0.26, 0.005, 0x0b1424, 0, 1.0, -0.083, { e: 0x0d1b33, ei: 1 }); scr.rotation.x = -0.2;
    var plot = new T.Group(); plot.position.set(0, 1.0, -0.078); plot.rotation.x = -0.2; cart.add(plot);
    var pts = []; for (var k = 0; k <= 24; k++) { var x = -0.18 + k * 0.015; pts.push(new T.Vector3(x, -0.08 + 0.15 * (1 - Math.exp(-k / 5)) + (k > 2 && k < 7 ? 0.02 : 0), 0)); }
    add(plot, new T.TubeGeometry(new T.CatmullRomCurve3(pts), 40, 0.004, 4), C.soft, 0, 0, 0, { e: C.soft, ei: 1.4 });
    box(plot, 0.38, 0.003, 0.003, 0x3a4658, 0, -0.09, 0); box(plot, 0.003, 0.2, 0.003, 0x3a4658, -0.19, 0.01, 0);
    // a small spotlight: this is what Aydan is on right now
    var wl = new T.SpotLight(0x8fabd4, 1.6, 7, 0.5, 0.6, 1.2); wl.position.set(4.6, 4.8, -2.6); wl.target = g; scene.add(wl);
    anim.wato = { lL: lL, lR: lR, head: head };
    tagAt('wato', new T.Vector3(0, 3.25, 0));
  })();

  // pickables
  Object.keys(items).forEach(function (id) { items[id].traverse(function (o) { if (o.isMesh) { o.userData.pick = id; pickables.push(o); } }); });

  // ---------------- labels ----------------
  var labelsEl = document.getElementById('labels'), tags = {};
  Object.keys(items).forEach(function (id) {
    var t = document.createElement('div'); t.className = 'tag' + (id === 'wato' ? ' me' : '');
    t.textContent = id === 'wato' ? 'watonomous · now' : byId[id].name.toLowerCase();
    labelsEl.appendChild(t); tags[id] = t;
  });
  var tmpV = new T.Vector3();
  function placeLabels() {
    var w = stage.clientWidth, h = stage.clientHeight;
    Object.keys(items).forEach(function (id) {
      var g = items[id], off = g.userData.tagOffset || new T.Vector3(0, 1, 0);
      tmpV.copy(off); g.localToWorld(tmpV.set(off.x, off.y, off.z));
      // keep label above the object regardless of the group's rotation
      tmpV.copy(g.getWorldPosition(new T.Vector3())).add(new T.Vector3(0, off.y, 0));
      tmpV.project(camera);
      var vis = tmpV.z < 1 && tmpV.x > -1.1 && tmpV.x < 1.1 && tmpV.y > -1.1 && tmpV.y < 1.1;
      var t = tags[id];
      t.style.opacity = vis && openId === null ? 1 : 0;
      t.style.left = ((tmpV.x + 1) / 2 * w) + 'px';
      t.style.top = ((1 - tmpV.y) / 2 * h) + 'px';
    });
  }

  // ---------------- hover + click ----------------
  var ray = new T.Raycaster(), mouse = new T.Vector2(), hovered = null, downAt = null;
  function setHot(id) {
    if (hovered === id) return;
    if (hovered && items[hovered]) items[hovered].traverse(function (o) { if (o.isMesh && o.userData.baseE != null) { o.material.emissive.setHex(o.userData.baseE); o.material.emissiveIntensity = o.userData.baseEI; } });
    if (hovered && tags[hovered]) tags[hovered].classList.remove('hot');
    hovered = id;
    if (id && items[id]) items[id].traverse(function (o) { if (o.isMesh) { if (o.userData.baseE == null) { o.userData.baseE = o.material.emissive.getHex(); o.userData.baseEI = o.material.emissiveIntensity; } if (o.userData.baseE === 0) { o.material.emissive.setHex(C.deep); o.material.emissiveIntensity = 0.35; } } });
    if (id && tags[id]) tags[id].classList.add('hot');
    renderer.domElement.style.cursor = id ? 'pointer' : 'grab';
  }
  function pick(e) {
    var r = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1; mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(mouse, camera);
    var hit = ray.intersectObjects(pickables, false)[0];
    return hit ? hit.object.userData.pick : null;
  }
  renderer.domElement.addEventListener('pointermove', function (e) { if (e.pointerType === 'mouse') setHot(pick(e)); });
  renderer.domElement.addEventListener('pointerdown', function (e) { downAt = [e.clientX, e.clientY]; });
  renderer.domElement.addEventListener('pointerup', function (e) {
    if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return; // was a drag
    var id = pick(e);
    if (id) openWin(id);
  });
  renderer.domElement.addEventListener('pointerleave', function () { setHot(null); });

  // ---------------- camera moves ----------------
  var fly = null;
  function goTo(pos, target) { fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, s: performance.now(), d: reduce ? 1 : 900 }; }
  // Hand-set camera angles: [camera position], [point to look at]. All inside the walls.
  var VIEWS = {
    wato:        [[1.62, 2.22, 1.2],  [4.0, 1.45, -3.7]],
    morph:       [[-0.84, 2.03, 8.22],  [-3.2, 0.75, 1.6]],
    birdiebot:   [[2.0, 1.53, 3.47],  [3.55, 0.5, 1.4]],
    brackey:     [[-3.24, 2.5, 1.34],  [-5.15, 1.15, -1.71]],
    rico:        [[2.45, 1.85, -1.85],  [1.85, 1.3, -3.45]],
    studybuddy:  [[0.05, 1.95, -1.75],  [-0.6, 1.33, -3.55]],
    neurostep:   [[-4.55, 1.62, -3.45],  [-5.1, 1.36, -4.5]],
    dogclutch:   [[-3.14, 2.88, -2.18],  [-3.65, 2.45, -4.5]],
    ftc:         [[4.55, 2.2, 3.95],  [5.7, 1.05, 0.05]],
  };
  focusItem = function (id) {
    var v = VIEWS[id]; if (!v) return;
    var pos = new T.Vector3().fromArray(v[0]), target = new T.Vector3().fromArray(v[1]);
    var dir = target.clone().sub(pos), dist = dir.length(); dir.normalize();
    var shift;
    if (stage.clientWidth < 700) {
      // window covers the bottom: lift the subject into the top half
      shift = new T.Vector3(0, -dist * 0.2, 0);
    } else {
      // window covers the right: slide the subject left
      shift = new T.Vector3().crossVectors(dir, new T.Vector3(0, 1, 0)).normalize().multiplyScalar(dist * 0.3);
    }
    pos.add(shift); target.add(shift);
    pos.y = Math.max(0.5, pos.y);
    goTo(pos, target);
  };
  resetView = function () { goTo(HOME.pos.clone(), HOME.target.clone()); };
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  // ---------------- sizing ----------------
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    camera.fov = w < 700 ? 55 : 40;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();
  if (stage.clientWidth < 700) { HOME.pos.set(8.5, 7.2, 14.5); camera.position.copy(HOME.pos); }

  // ---------------- animate ----------------
  var clock = new T.Clock();
  function morphAt(t) {
    var m = anim.morph, N = m.cubes.length, cyc = 8, ph = (t % cyc) / cyc, k;
    // 0-.35 hold table, .35-.5 fold to line, .5-.85 hold line, .85-1 fold to table
    var dir, p;
    if (ph < 0.35) { p = 1; dir = 1; } else if (ph < 0.5) { p = 1 - (ph - 0.35) / 0.15; dir = -1; } else if (ph < 0.85) { p = 0; dir = 1; } else { p = (ph - 0.85) / 0.15; dir = 1; }
    for (k = 0; k < N; k++) {
      var local = Math.max(0, Math.min(1, p * 1.6 - (dir > 0 ? k : N - 1 - k) * 0.035));
      var e = ease(local);
      var a = m.A[k], b = m.B[k];
      m.cubes[k].position.set((a[0] + (b[0] - a[0]) * e) * m.sz, ((a[1] + (b[1] - a[1]) * e) + 0.5) * m.sz, 0);
    }
  }
  function frame() {
    var t = clock.getElapsedTime();
    if (fly) {
      var k = Math.min(1, (performance.now() - fly.s) / fly.d), e = ease(k);
      camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e);
      if (k >= 1) fly = null;
    }
    controls.update();
    if (!reduce) {
      morphAt(t);
      anim.gears.g1.rotation.z = t * 1.2; anim.gears.g2.rotation.z = -t * 1.2 * (14 / 20) + 0.1;
      anim.turret.update(t);
      anim.rico.update(t);
      anim.birdie.update(t);
      var B = anim.brackey;
      B.pose(t);
      B.body.rotation.x = Math.sin(t * 1.9) * 0.025 + Math.sin(t * 0.7) * 0.012;
      anim.ftc.pose(t);
      var W = anim.wato, sw = Math.sin(t * 1.4);
      W.lL.knee.rotation.x = 0.3 + sw * 0.3; W.lL.hip.rotation.x = -0.12 - sw * 0.1;
      W.lR.knee.rotation.x = 0.08; W.head.rotation.y = Math.sin(t * 0.3) * 0.15;
    } else {
      morphAt(0.5);
    }
    renderer.render(scene, camera);
    placeLabels();
    requestAnimationFrame(frame);
  }
  loading.hidden = true;
  renderer.domElement.style.cursor = 'grab';
  requestAnimationFrame(frame);
})();
</script>
</body>
